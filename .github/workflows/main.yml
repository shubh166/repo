    # .github/workflows/java-workflow.yml
    name: Run Simple Java Code

    on: [push] # Triggers the workflow on every push to the repository

    jobs:
      build-and-run:
        runs-on: ubuntu-latest # Specifies the runner environment

        steps:
          - uses: actions/checkout@v4 # Checks out your repository code

          - name: Set up JDK 17
            uses: actions/setup-java@v4
            with:
              java-version: '17' # Specifies the Java version
              distribution: 'temurin' # Specifies the Java distribution

          - name: Compile Java code
            run: javac shubham1.java # Compiles the Java file

          - name: Run Java code
            run: java shubham1 # Executes the compiled Java class
